<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Proven · DM Code{% endblock %}</title>
  <style>
    :root {
      --ink: #0e1f19; --paper: #f5f7f4; --card: #ffffff;
      --brand: #123c2e; --accent: #d9a441;
      --good: #1c7c43; --warn: #b7791f; --bad: #b3372f;
      --line: #e2e8e3; --muted: #64736b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
           background: var(--paper); color: var(--ink); }
    header.top { background: var(--brand); color: #fff; padding: 14px 22px;
                 display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    header.top .logo { font-weight: 800; letter-spacing: .06em; font-size: 18px; }
    header.top .logo em { color: var(--accent); font-style: normal; }
    header.top nav { margin-left: auto; display: flex; gap: 14px; align-items: center; }
    header.top a { color: #dfe9e2; text-decoration: none; font-size: 14px; }
    header.top a:hover { color: #fff; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 26px; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
    input[type=text], input[type=password], textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #c9d3cc;
      border-radius: 9px; font-size: 15px; background: #fbfdfb;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--brand); }
    button, .btn { background: var(--brand); color: #fff; border: 0; border-radius: 9px;
                   padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
    .btn.gold { background: var(--accent); color: #2c2103; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 220px; }
    .pill { display: inline-block; padding: 3px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .pill.good { background: #e2f3e8; color: var(--good); }
    .pill.warn { background: #fbf0da; color: var(--warn); }
    .pill.bad  { background: #fae3e1; color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
         text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px;
         border-bottom: 2px solid var(--line); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:hover td { background: #f4f8f4; }
    code, .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
    .flash { padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; font-size: 14px; }
    .flash.error { background: #fae3e1; color: var(--bad); }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
                  gap: 14px; margin-bottom: 22px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; }
    .stat b { display: block; font-size: 28px; }
    .stat span { color: var(--muted); font-size: 13px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="logo">PROVEN<em>·</em>DM&nbsp;CODE</div>
  <nav>
    <a href="{{ url_for('index') }}">Verify a product</a>
    {% if brand %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <form method="post" action="{{ url_for('logout') }}" style="margin:0">
        <button class="btn ghost" style="padding:6px 14px;font-size:13px;color:#fff;border-color:#fff">
          Sign out ({{ brand['name'] }})</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Brand sign-in</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>Proven — tamper-evident Data Matrix authentication · every scan is ledgered</footer>
</body>
</html>
